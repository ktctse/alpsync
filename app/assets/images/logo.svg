<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One arm of the mark: spoke, tip twig, hexagon edge and the asanoha
         (hemp-leaf) lines of one triangle. Rotated six times below. -->
    <g id="arm">
      <path d="M32 32V7.2M28.4 8.2 32 11.6l3.6-3.4M32 14l15.6 9M32 14l5.2 9-5.2 9m5.2-9h10.4"/>
    </g>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#0084d1"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="27.5" stroke-width="2.6"/>
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60 32 32)"/>
    <use href="#arm" transform="rotate(120 32 32)"/>
    <use href="#arm" transform="rotate(180 32 32)"/>
    <use href="#arm" transform="rotate(240 32 32)"/>
    <use href="#arm" transform="rotate(300 32 32)"/>
  </g>
</svg>
